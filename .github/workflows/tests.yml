# The suite needs no network and no secrets: conftest supplies a dummy Discord
# token, every test that touches a database uses a temporary SQLite file, and the
# webhook tests bind loopback. Verified by running it in a container with
# --network none before this workflow was written.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    name: test suite (no dev dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Dockerfile. The bot is not tested on other versions.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # The canonical runner: standard library only, which is what lets the suite
      # run inside the production image.
      - run: python tests/run_all.py

  pytest:
    name: same suite under pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # The README claims `pytest tests/` also works. This is what keeps that true.
      - run: pytest tests/ -q

  image:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The deploy path is Docker, so a broken Dockerfile matters as much as a
      # broken test. Build only - there is nothing to run without a real token.
      - run: docker build -t plexbie:ci .

      # tests/ is excluded from the image by .dockerignore, so the suite cannot be
      # run with `docker run` alone; mount the checkout over it as rebuild.sh's
      # verification step does.
      - name: run the suite inside the built image
        run: |
          docker run --rm --network none \
            -v "$PWD:/src" -w /src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            plexbie:ci python tests/run_all.py
